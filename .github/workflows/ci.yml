name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/nararya_ci?schema=public
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - name: Security audit report
        run: |
          npm audit --json > audit.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('audit.json','utf8'));const v=x.vulnerabilities||{};const rows=Object.entries(v).filter(([,a])=>['high','critical'].includes(a.severity)).map(([name,a])=>name+' '+a.severity+' fix='+String(a.fixAvailable));if(rows.length){console.error(rows.join('\\n'));process.exit(1)}console.log('No high/critical vulnerabilities reported.');"
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run check:js
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
